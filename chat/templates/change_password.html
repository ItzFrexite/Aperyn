<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0e13"><title>Change password · Aperyn</title><link rel="icon" href="/static/icons/icon-192.png" type="image/png"><link rel="stylesheet" href="/static/theme.css?v=1.27.8-r1"><link rel="stylesheet" href="/static/auth.css?v=1.27.8-r1"></head>
<body class="auth-body"><main class="auth-shell"><section class="auth-card"><div class="auth-brand"><img src="/static/brand/aperyn-mark.svg" alt=""><div><strong>Secure your account</strong><span>{{ current_user.username }}</span></div></div><div><span class="eyebrow">REQUIRED</span><h1>Choose a new password</h1><p>Your temporary password must be replaced before the application can be used.</p></div>{% if error %}<div class="auth-error" role="alert">{{ error }}</div>{% endif %}<form method="post" class="auth-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Current password<input class="text-input" name="current_password" type="password" autocomplete="current-password" required></label><label>New password<input class="text-input" name="new_password" type="password" autocomplete="new-password" minlength="10" required></label><label>Confirm new password<input class="text-input" name="confirm_password" type="password" autocomplete="new-password" minlength="10" required></label><button class="btn primary" type="submit">Change password</button></form></section></main></body></html>
