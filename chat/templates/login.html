<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0e13"><title>Sign in · Aperyn</title>
  <link rel="icon" href="/static/icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="/static/theme.css?v=1.27.8-r1"><link rel="stylesheet" href="/static/auth.css?v=1.27.8-r1">
</head>
<body class="auth-body">
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="login-title">
      <div class="auth-brand"><img src="/static/brand/aperyn-mark.svg" alt=""><div><strong>Aperyn</strong><span>An Ollama model editor and chat</span></div></div>
      <div><span class="eyebrow">LOCAL ACCOUNT</span><h1 id="login-title">Welcome back</h1><p>Sign in to Chat, model management, telemetry, and settings.</p></div>
      {% if error %}<div class="auth-error" role="alert">{{ error }}</div>{% endif %}
      <form method="post" class="auth-form">
        <label>Username<input class="text-input" name="username" autocomplete="username" required autofocus></label>
        <label>Password<input class="text-input" name="password" type="password" autocomplete="current-password" required></label>
        <button class="btn primary" type="submit">Sign in</button>
      </form>
      <small>Fresh installations start with <code>admin</code> / <code>password</code> and require an immediate password change.</small>
    </section>
  </main>
</body></html>
